name: build

# Continuous integration, in two jobs.
#
# `host-tests` builds the portable modules with the runner's own compiler and
# actually runs them. It needs no ESP-IDF, so it finishes in seconds and is the
# only job here that executes code rather than just compiling it.
#
# `firmware` builds the real thing (and the on-target unit-test app) with a
# pinned ESP-IDF release. A green run there is the same `idf.py build`
# contributors run locally, so the tree is guaranteed to compile.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (no hardware)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run
        run: make -C tests/host

      - name: Build and run under the sanitizers
        run: make -C tests/host clean && make -C tests/host SAN=1

  firmware:
    name: Firmware (esp32, ESP-IDF v5.2.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.1
          target: esp32
          path: firmware
          command: idf.py build

      - name: Build on-target unit tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.1
          target: esp32
          path: firmware/test
          command: idf.py build

      - name: Collect firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-csi-sensor-esp32
          path: |
            firmware/build/nexus_csi_sensor.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: warn
